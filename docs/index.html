<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quincena - Dashboard Financiero</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
      color: #222;
    }

    header {
      background: #1a73e8;
      color: white;
      padding: 24px;
      text-align: center;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-top: 0;
      color: #555;
      font-size: 15px;
    }

    .card p {
      font-size: 28px;
      font-weight: bold;
      margin: 8px 0 0;
      color: #1a73e8;
    }

    section {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    input, button {
      padding: 10px;
      margin: 6px 0;
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #1a73e8;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1558b0;
    }

    ul {
      padding-left: 20px;
    }

    .ok {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Quincena</h1>
    <p>Dashboard financiero conectado a Google Cloud</p>
  </header>

  <main>
    <div class="cards">
      <div class="card">
        <h3>Gastado</h3>
        <p id="gastado">$0</p>
      </div>

      <div class="card">
        <h3>Proyectado</h3>
        <p id="proyectado">$0</p>
      </div>

      <div class="card">
        <h3>Safe to spend</h3>
        <p id="safe">$0</p>
      </div>

      <div class="card">
        <h3>Presupuesto normal</h3>
        <p id="normal">$0</p>
      </div>
    </div>

    <section>
      <h2>Registrar gasto</h2>

      <label>Monto</label>
      <input id="monto" type="number" step="0.01" placeholder="Ej. 120.50" />

      <label>Categoría</label>
      <input id="categoria" type="text" placeholder="Ej. comida, transporte, café" />

      <label>Fecha</label>
      <input id="fecha" type="date" />

      <button onclick="registrarGasto()">Guardar gasto</button>

      <p id="mensaje"></p>
    </section>

    <section>
      <h2>Desglose por categoría</h2>
      <ul id="desglose"></ul>
    </section>

    <section>
      <h2>Anomalías</h2>
      <ul id="anomalias"></ul>
    </section>

    <section>
      <button onclick="cargarDashboard()">Actualizar dashboard</button>
    </section>
  </main>

  <script>
    const API_URL = "https://quincena-api-533093663517.us-central1.run.app";
    const USUARIO_ID = 1;

    function formatoMoneda(valor) {
      return "$" + Number(valor).toFixed(2);
    }

    async function cargarDashboard() {
      const respuesta = await fetch(`${API_URL}/dashboard?usuario_id=${USUARIO_ID}`);
      const data = await respuesta.json();

      document.getElementById("gastado").textContent = formatoMoneda(data.gastado);
      document.getElementById("proyectado").textContent = formatoMoneda(data.proyectado);
      document.getElementById("safe").textContent = formatoMoneda(data.safe_to_spend);
      document.getElementById("normal").textContent = formatoMoneda(data.normal_mensual);

      const desglose = document.getElementById("desglose");
      desglose.innerHTML = "";

      data.desglose.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.categoria}: ${formatoMoneda(item.total)}`;
        desglose.appendChild(li);
      });

      const anomalias = document.getElementById("anomalias");
      anomalias.innerHTML = "";

      if (data.anomalias.length === 0) {
        const li = document.createElement("li");
        li.textContent = "No hay anomalías detectadas.";
        anomalias.appendChild(li);
      } else {
        data.anomalias.forEach(item => {
          const li = document.createElement("li");
          li.textContent = `${item.categoria}: ${formatoMoneda(item.monto)} (${item.fecha})`;
          anomalias.appendChild(li);
        });
      }
    }

    async function registrarGasto() {
      const monto = document.getElementById("monto").value;
      const categoria = document.getElementById("categoria").value;
      const fecha = document.getElementById("fecha").value;
      const mensaje = document.getElementById("mensaje");

      if (!monto || !categoria || !fecha) {
        mensaje.textContent = "Completa monto, categoría y fecha.";
        mensaje.className = "error";
        return;
      }

      const respuesta = await fetch(`${API_URL}/gastos`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          usuario_id: USUARIO_ID,
          monto: Number(monto),
          categoria: categoria,
          fecha: fecha
        })
      });

      const data = await respuesta.json();

      if (respuesta.ok) {
        mensaje.textContent = data.message || "Gasto registrado correctamente.";
        mensaje.className = "ok";

        document.getElementById("monto").value = "";
        document.getElementById("categoria").value = "";

        await cargarDashboard();
      } else {
        mensaje.textContent = "Error al registrar gasto.";
        mensaje.className = "error";
      }
    }

    document.getElementById("fecha").valueAsDate = new Date();
    cargarDashboard();
  </script>
</body>
</html>
